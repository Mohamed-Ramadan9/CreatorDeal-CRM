server:
  port: 8072

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: creator-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/creators/**

        - id: brand-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/brands/**

        - id: deal-service-deals
          uri: http://localhost:8083
          predicates:
            - Path=/api/deals/**

        - id: deal-service-deliverables
          uri: http://localhost:8083
          predicates:
            - Path=/api/deliverables/**

        - id: invoice-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/invoices/**

        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/reminders/**

eureka:
  instance:
    prefer-ip-address: true

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8070/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway