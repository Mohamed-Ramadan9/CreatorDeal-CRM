server:
  port: 8081

spring:
  application:
    name: deal-service

  datasource:
    url: jdbc:postgresql://localhost:5432/creator_deal_db
    username: postgres
    password: your_password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  config:
    import: optional:configserver:http://localhost:8071

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8070/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
